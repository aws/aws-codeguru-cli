
name: Build, test and release

on: [push, pull_request, workflow_dispatch]

permissions:
    contents: read

jobs:
  BuildAndTest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: Build and unit test on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 8
      - name: Build project and run unit tests
        run: ./gradlew clean test installDist distZip

  PublishVersion:
    name: Publish Release
    # Release only from main; pull requests and other branches run the build and unit tests only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # write permissions are needed to upload the release
    needs:
      - BuildAndTest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 8
      - name: Build project
        run: ./gradlew clean installDist distZip

      - name: Get Release Version
        id: version
        run: |
          TAG_NAME=$(./gradlew properties -q | grep "version:" | awk '{print $2}')
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          # Do not overwrite an existing release: publish only when the version in build.gradle is new.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" > /dev/null; then
            echo "Release $TAG_NAME already exists; skipping publish."
            echo "PUBLISH=false" >> "$GITHUB_OUTPUT"
          else
            echo "PUBLISH=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.version.outputs.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          prerelease: false
          draft: false
          body: >
            Version ${{ steps.version.outputs.TAG_NAME }} of the AWS CodeGuru Reviewer CLI.
          files: |
            ./build/distributions/aws-codeguru-cli.zip
            LICENSE
